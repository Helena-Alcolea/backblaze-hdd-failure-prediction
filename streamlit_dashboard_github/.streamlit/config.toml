# Settings of the app, read by Streamlit from this folder (next to streamlit_app.py), here and online.

[browser]
# No usage statistics are sent to Streamlit.
gatherUsageStats = false

[server]
headless = true
# Serve the header photo from static/, next to the app.
enableStaticServing = true

[client]
# Viewer toolbar, without the developer options.
toolbarMode = "viewer"

# The palette coolors.co/f72585-b5179e-7209b7-560bad-480ca8-3a0ca3-3f37c9-4361ee-4895ef-4cc9f0: the page is a
# gradient through it (drawn by the app's CSS over this background), with white boxes, indigo borders (#3a0ca3),
# navy text and light violet shades in the tables. A single light theme: no dark mode.
[theme]
base = "light"
primaryColor = "#3a0ca3"
backgroundColor = "#fdfcff"
secondaryBackgroundColor = "#f4f1fb"
textColor = "#2b2d42"
borderColor = "#3a0ca3"
dataframeBorderColor = "#e6e0f3"
dataframeHeaderBackgroundColor = "#efe9fa"
blueBackgroundColor = "#eef0fd"
blueTextColor = "#2b2d42"
headingFontWeights = [700, 650]
